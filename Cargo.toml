[workspace]
resolver = "2"
members = ["core", "examples/memory-catalog", "examples/rest-catalog", "integration-tests"]

[workspace.dependencies]
# Async runtime and utilities
async-stream = "0.3.5"
async-trait = "0.1.89"

# Data processing and storage
ctor = "0.2.8"
datafusion = "53.0"

# Local workspace members
futures = "0.3.17"
iceberg = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "11e09f86c908711770eae2f77220f286adccc58b", features = ["storage-s3", "storage-azblob", "storage-azdls"] }
iceberg-catalog-glue = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "11e09f86c908711770eae2f77220f286adccc58b" }
iceberg-catalog-memory = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "11e09f86c908711770eae2f77220f286adccc58b" }
iceberg-catalog-rest = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "11e09f86c908711770eae2f77220f286adccc58b" }
iceberg-compaction-core = { path = "./core" }
iceberg-datafusion = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "11e09f86c908711770eae2f77220f286adccc58b" }

parquet = { version = "58.1", features = ["async"] }
port_scanner = "0.1.5"
rand = "0.9.0"

# Utilities
tempfile = "3.8"

# Error handling
thiserror = "2.0.11"
tokio = { version = "1", default-features = false }
tracing = "0.1"
url = "2"
uuid = { version = "1.0", features = ["v7"] }

[workspace.lints.clippy]
uninlined_format_args = "allow"
dbg_macro = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
inconsistent_struct_constructor = "warn"
unused_async = "warn"
map_flatten = "warn"
await_holding_lock = "warn"
# For private code, this is a little pedantic and not worth fixing.
# &Vec or &String is acceptable
ptr_arg = "allow"
# a little pedantic
get_first = "allow"
new_without_default = "allow"
# TODO: remove later https://github.com/rust-lang/rust-clippy/issues/12537
# duplicated_attributes = "allow"
# TODO: remove later https://github.com/rust-lang/rust-clippy/issues/12436
mixed_attributes_style = "allow"
too_long_first_doc_paragraph = "allow"
str_to_string = "warn"

# TODO: this makes sense, but it's too noisy for now (2025-03-10)
large_enum_variant = "allow"
# TODO: this makes sense, but it's too noisy for now (2025-03-10)
result_large_err = "allow"

# Match the Iceberg revision used by production consumers.
[patch."https://github.com/risingwavelabs/iceberg-rust.git"]
iceberg = { git = "https://github.com/auguria-io/iceberg-rust", rev = "65371fac1acfae68ef42f0cb68ab107535caf13d" }
iceberg-catalog-glue = { git = "https://github.com/auguria-io/iceberg-rust", rev = "65371fac1acfae68ef42f0cb68ab107535caf13d" }
iceberg-catalog-rest = { git = "https://github.com/auguria-io/iceberg-rust", rev = "65371fac1acfae68ef42f0cb68ab107535caf13d" }
iceberg-datafusion = { git = "https://github.com/auguria-io/iceberg-rust", rev = "65371fac1acfae68ef42f0cb68ab107535caf13d" }

# Dependency patches are applied at the workspace root, not inherited from Iceberg.
[patch.crates-io]
arrow = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-array = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-buffer = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-data = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-schema = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-cast = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-csv = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-json = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-ord = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-row = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-string = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-select = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-ipc = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
arrow-arith = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
parquet = { git = "https://github.com/auguria-io/arrow-rs-internal", rev = "3b76e4ebb2e546c1671f36a0431168a0dfbd6def" }
