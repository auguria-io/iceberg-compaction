# Builds and runtime tests run in private rust-pkgs CI; see CI_VALIDATION.md.
name: CI
on:
  push:
    branches: [main, greed/datafusion-memory-pool]
  pull_request:
    branches: [main, greed/datafusion-memory-pool]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-format:
    name: Public Rust and TOML formatting (not runtime tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup repository Rust toolchain
        uses: ./.github/actions/setup-builder
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli@0.9.3
      - run: cargo fmt --all -- --check
      - run: taplo check
      - name: Explain separate runtime validation
        run: |
          echo 'Public formatting passed. This does not validate builds or runtime behaviour.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Before merge, review the private Fork Dependency Validation run for this exact commit; see CI_VALIDATION.md.' >> "$GITHUB_STEP_SUMMARY"
